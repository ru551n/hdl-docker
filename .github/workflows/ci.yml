name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: hdl-docker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm hdl-docker:ci ghdl --version
          docker run --rm hdl-docker:ci yosys -m ghdl -p 'help ghdl'
          docker run --rm hdl-docker:ci nvc --version
          docker run --rm hdl-docker:ci vhdl_ls --help
          docker run --rm hdl-docker:ci veridian --help
