name: Build and publish Docker image

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch: {}

env:
  IMAGE_NAME: ru551n/hdl-docker

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tags
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest"
          else
            # Push to main (e.g. a merged PR) or manual dispatch on a branch:
            # publish a rolling tag, distinct from the versioned/`latest`
            # tags which are only ever set from an actual `vX.Y.Z` release.
            TAGS="${IMAGE_NAME}:main"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
